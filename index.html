<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muse: 小说架构师</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@300;400;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#0f172a">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['"Noto Serif SC"', 'serif'],
            },
            colors: {
              muse: {
                50: '#f4f6ff',
                100: '#eef1ff',
                200: '#e0e7ff',
                300: '#c7d2fe',
                400: '#a5b4fc',
                500: '#818cf8',
                600: '#6366f1',
                700: '#4f46e5',
                800: '#3730a3',
                900: '#312e81',
                950: '#1e1b4b',
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0f172a;
        color: #e2e8f0;
      }

      /* 焦点可见指示器 - 可访问性增强 */
      *:focus-visible {
        outline: 2px solid #8b5cf6 !important;
        outline-offset: 2px !important;
        border-radius: 4px !important;
      }

      /* 移除默认焦点样式，使用focus-visible */
      *:focus {
        outline: none;
      }

      /* Skip Link样式 - 允许键盘用户跳过导航 */
      .skip-link {
        position: absolute;
        top: -100px;
        left: 16px;
        padding: 8px 16px;
        background-color: #8b5cf6;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        z-index: 9999;
        font-weight: 600;
        font-size: 14px;
        transition: top 0.3s;
      }

      .skip-link:focus {
        top: 16px;
      }

      /* 屏幕阅读器专用类 */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b;
      }
      ::-webkit-scrollbar-thumb {
        background: #475569;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }
      /* Custom animations */
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes scale-in {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes slide-in-right {
        from { opacity: 0; transform: translateX(100%); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes slide-in-from-top-2 {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes slide-in-from-left-2 {
        from { opacity: 0; transform: translateX(-8px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes pulse-soft {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
      @keyframes slide-in-from-left-2 {
        from { opacity: 0; transform: translateX(-8px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes pulse-soft {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.7; }
      }
      .animate-fade-in {
        animation: fade-in 0.2s ease-out;
      }
      .animate-scale-in {
        animation: scale-in 0.3s ease-out;
      }
      .animate-slide-in-right {
        animation: slide-in-right 0.3s ease-out;
      }
      .animate-in {
        animation-duration: 300ms;
        animation-timing-function: ease-out;
        animation-fill-mode: both;
      }
      .slide-in-from-top-2 {
        animation-name: slide-in-from-top-2;
      }
      .slide-in-from-left-2 {
        animation-name: slide-in-from-left-2;
      }
      .fade-in {
        animation-name: fade-in;
      }
      .animate-pulse-soft {
        animation: pulse-soft 2s ease-in-out infinite;
      }
    </style>
    <link rel="stylesheet" href="/styles/accessibility.css">
    <link rel="stylesheet" href="/src/styles/responsive.css">
    <link rel="stylesheet" href="/src/styles/theme.css">
    <link rel="stylesheet" href="/src/styles/loading.css">
    <link rel="stylesheet" href="/src/styles/animations.css">
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.574.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <!-- Skip Link - 允许键盘用户快速跳到主内容 -->
    <a href="#main-content" class="skip-link">
      跳到主内容
    </a>

    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
